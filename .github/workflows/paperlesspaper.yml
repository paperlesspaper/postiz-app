name: Paperlesspaper image

on:
  push:
    branches: [paperlesspaper/reel-handoff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: github.repository == 'paperlesspaper/postiz-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:reels
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ghcr.io/paperlesspaper/postiz-app:reels-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/paperlesspaper/postiz-app
          build-args: NEXT_PUBLIC_VERSION=v2.23.0-paperlesspaper-reels
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
